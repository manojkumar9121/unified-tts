[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-tts"
version = "1.0.0"
description = "A single web UI for multiple text-to-speech engines — local ONNX and online services"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    # Core web stack + basic audio I/O
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "numpy>=1.24",
    "soundfile>=0.12",
    "psutil>=5.9",
    # Required by FastAPI UploadFile / Form (voice registration endpoint)
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Minimal usable install: web UI plus both online engines.
core = [
    "edge-tts>=6.1.0",
    "gTTS>=2.5.0",
]
# Local ONNX engines (Piper, Kokoro, Audio8) + DSP for pitch/speed
local = [
    "librosa>=0.10",
    "piper-tts>=1.2.0",
    "kokoro-onnx>=0.4.0",
    "kittentts>=0.8.1",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
]
# Online engines (Microsoft Edge, Google Translate)
online = [
    "edge-tts>=6.1.0",
    "gTTS>=2.5.0",
]
# MP3/FLAC export support — requires system ffmpeg
audio = [
    "pydub>=0.25",
]
# Everything (same as the legacy requirements.txt)
all = [
    "unified-tts[local,online,audio]",
]
# Test/lint tooling — pinned so CI and local stay in lock-step and linters
# cannot silently enable new rules that break the build on version bumps.
dev = [
    "pytest==9.1.1",
    "httpx>=0.27",         # FastAPI TestClient backend
    "ruff==0.16.4",
    "mypy==2.3.1",
    "build>=1.2",
    "pytest-cov>=6.0",
    "tomli>=2.0; python_version < '3.11'",  # tomllib backport for the 3.10 CI leg
]

[project.scripts]
unified-tts = "server:main"

[tool.setuptools]
# Root-level flat modules must be packaged for the console script
# (`unified-tts` imports `server`) to work after pip install.
py-modules = [
    "server",
    "tts_engine",
    "audio8_manager",
    "model_downloader",
    "check_deps",
]
packages = ["audio8_repo", "static", "templates"]
include-package-data = true

[tool.setuptools.package-data]
static = ["*.js", "*.css"]
templates = ["*.html"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["audio8_repo"]  # vendored runtime

[tool.ruff.lint]
# Patterns that are intentional in this codebase:
#   BLE001 / S110 / S112 — broad `except Exception` is deliberate around
#       engine + download calls so one failing engine can't crash the server.
#   B008   — FastAPI uses `File()` / `Form()` in endpoint default args (standard).
#   B017   — tests intentionally assert on broad exceptions (fallback paths).
#   RUF012 — engines declare class-level config (lists/dicts) overridden per subclass.
ignore = ["BLE001", "S110", "S112", "B008", "B017", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
