[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-tts"
version = "1.0.0"
description = "A single web UI for multiple text-to-speech engines — local ONNX and online services"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    # Core web stack + basic audio I/O
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "numpy>=1.24",
    "soundfile>=0.12",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Local ONNX engines (Piper, Kokoro, Audio8) + DSP for pitch/speed
local = [
    "librosa>=0.10",
    "piper-tts>=1.2.0",
    "kokoro-onnx>=0.4.0",
    "kittentts>=0.8.1",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
]
# Online engines (Microsoft Edge, Google Translate)
online = [
    "edge-tts>=6.1.0",
    "gTTS>=2.5.0",
]
# MP3/FLAC export support — requires system ffmpeg
audio = [
    "pydub>=0.25",
]
# Everything (same as the legacy requirements.txt)
all = [
    "unified-tts[local,online,audio]",
]
# Test/lint tooling
dev = [
    "pytest>=8.0",
    "httpx>=0.27",         # FastAPI TestClient backend
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
unified-tts = "server:main"

[tool.setuptools]
# Root-level flat modules must be packaged for the console script
# (`unified-tts` imports `server`) to work after pip install.
py-modules = [
    "server",
    "tts_engine",
    "audio8_manager",
    "model_downloader",
    "check_deps",
]
packages = ["audio8_repo"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["audio8_repo"]  # vendored runtime

[tool.pytest.ini_options]
testpaths = ["tests"]
